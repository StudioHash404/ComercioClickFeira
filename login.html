<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./login.css">
    <title>Login</title>
</head>
<body>
    <!-- Conteúdo principal da página de login -->
    <div class="login-container">

        <!-- Mensagens de boas-vindas -->
        <div class="login-header">
            <h1>Bem-vindo(a) de volta!</h1>
            <p>Coloque suas credenciais para acessar sua conta</p>
        </div>

        <!-- Formulário de login principal -->
        <form class="login-form">

            <!-- Usuário e E-mail -->
            <div class="form-group">
                <label for="username">Usuário ou E-mail</label>
                <input type="text" id="username" name="username" required>
            </div>

            <!-- Grupo da senha -->
            <div class="form-group">
                <label for="password">Senha</label>

                <!-- Container para exibir e ocultar senha -->          
                <div class="password-field">
                    <input type="password" id="password" name="password" required autocomplete=“current-password”>

                    <!-- Botão para alternar visibilidade da senha -->
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                        <!-- Ícone SVG de olho (mostra/esconde a senha) -->
                        <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <!-- Olho aberto (mostrado quando a senha está oculta) -->
                            <path class="eye-open" d="M12 4.5c-5 0-9.27 3.11-11 7.5 1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>

                            <!-- Olho fechado (mostrado quando a senha está visível) -->
                            <path class="eye-closed" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" style="display: none;"/>
                        </svg>
                    </button>
                </div>

                <!-- Mensagem de erro (ocultada com JS) -->
                <div class="error-message" style="display: none;">A senha deve ser maior que 6 caracteres</div>
            </div>

            <div class="form-options">

                <!--Caixa de lembrar senha-->
                <div class="remember-me">

                    <!--Caixa para fazer o negocio ai de cima funcionar-->
                    <input type="checkbox" id="remember" name="remember">

                    <!--label para o remember-->
                    <label for="remember">Lembrar de mim</label>
                </div>

                <!--Link para recuperar senha-->
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
            </div>

            <!--botao para enviar o login-->
            <button type="submit" class="login-button">Entrar</button>
            
            <!--Seçao de registro-->
            <div class="register-link">

                <!--Texto de registro-->
                <p>Não tem uma conta? <a href="./cadastro.html">Criar conta</a></p>
            </div>

            <div class="register-link">

                <!--Texto de registro-->
                <p>Não tem uma conta de vendedor(a)? <a href="./cadVendedor.html">Criar conta</a></p>
            </div>

        </form>

    </div>

    <script src="./login.js"></script>

</body>
</html>
