<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./cadastro.css">
    <title>Cadastro cliente</title>
</head>
<body>
    <!-- Conteúdo principal da página de cadastro -->
    <div class="register-container">

        <!-- Mensagens de boas-vindas -->
        <div class="register-header">
            <h1>Crie sua conta de cliente!</h1>
            <p>Preencha os dados abaixo para começar</p>
        </div>

        <!-- Formulário de cadastro principal -->
        <form class="register-form">

            <!-- Usuário -->
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required>
            </div>


            <!-- E-mail -->
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Grupo da senha -->
            <div class="form-group">
                <label for="password">Senha</label>

                <!-- Container para exibir e ocultar senha -->
                <div class="password-field">
                    <input type="password" id="password" name="password" required autocomplete="new-password">

                    <!-- Botão para alternar visibilidade da senha -->
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                        <!-- Ícone SVG de olho -->
                        <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <!-- Olho aberto -->
                            <path class="eye-open" d="M12 4.5c-5 0-9.27 3.11-11 7.5 1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>

                            <!-- Olho fechado -->
                            <path class="eye-closed" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" style="display: none;"/>
                        </svg>
                    </button>
                </div>

                <!-- Mensagem de erro da senha -->
                <div class="error-message" style="display: none;">A senha deve ter no mínimo 6 caracteres</div>
            </div>

            <!-- Confirmar senha -->
            <div class="form-group">
                <label for="confirm-password">Confirmar senha</label>

                <div class="password-field">
                    <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">

                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                        <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path class="eye-open" d="M12 4.5c-5 0-9.27 3.11-11 7.5 1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            <path class="eye-closed" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" style="display: none;"/>
                        </svg>
                    </button>
                </div>

                <!-- Mensagem de erro da confirmação -->
                <div class="error-message" style="display: none;">As senhas não coincidem</div>
            </div>

            <!-- Termos e condições -->
            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">Eu aceito os <a href="./termosdeuso.html">Termos e Condições</a></label>
                </div>
            </div>

            <!-- Botão de cadastro -->
            <button type="submit" class="register-button">Criar conta</button>

            <!-- Link para login -->
            <div class="login-link">
                <p>Já tem uma conta? <a href="./login.html">Fazer login</a></p>
            </div>

            <div class="login-vendedor">
                <p>Já tem uma conta de vendedor(a)? <a href="./loginVendedor.html">Fazer login de vendedor(a)</a></p>
            </div>

        </form>

    </div>

    <script src="./cadastro.js"></script>

    <!--Deus abençoe nosso backend-->

</body>
</html>
